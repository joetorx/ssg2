{% extends "base.html" %}
{% block title %}{{ page.title }}{% endblock %}
{% block content %}
<article>
    <h2>{{ page.title }}</h2>
    <p>Published on
    <time datetime="{{ page.date.isoformat() }}">
    {{ page.date.strftime("%b %d, %Y") }}
    </time>
    </p>
    {{ page.html }}
</article>
{% endblock %}
